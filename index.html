<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 连连看</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwYTBlMWMiLz48cmVjdCB4PSI2IiB5PSIyOCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzNiNmZkNCIvPjxyZWN0IHg9IjM0IiB5PSIxMiIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iI2ZmZDE2NiIvPjxwb2x5bGluZSBwb2ludHM9IjE4LDQwIDE4LDI0IDQ2LDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM3YWEyZmYiIHN0cm9rZS13aWR0aD0iNCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <h1>3D 连连看</h1>
  <p class="subtitle">找出相同图案 · 折线转弯不超过两次</p>

  <div class="hud">
    <div class="hud-stats">
      <div class="stat"><span class="label">得分</span><span class="value" id="score">0</span></div>
      <div class="stat combo" id="comboStat"><span class="label">连击</span><span class="value" id="combo">—</span></div>
      <div class="stat best" id="bestStat"><span class="label">最高分</span><span class="value" id="best">0</span></div>
      <div class="stat" id="statTime"><span class="label" id="timeLabel">用时</span><span class="value" id="time">00:00</span></div>
      <div class="stat"><span class="label">剩余对数</span><span class="value" id="pairs">12</span></div>
    </div>
    <div class="hud-controls">
      <div class="mode" id="mode" role="group" aria-label="模式选择">
        <button type="button" class="mode-btn" data-mode="endless">无尽</button>
        <button type="button" class="mode-btn" data-mode="timed">限时 120s</button>
      </div>
      <div class="difficulty" id="difficulty" role="group" aria-label="难度选择">
        <button type="button" class="diff-btn" data-key="easy">简单 4×4</button>
        <button type="button" class="diff-btn" data-key="normal">标准 4×6</button>
        <button type="button" class="diff-btn" data-key="hard">困难 6×8</button>
      </div>
      <button id="rank" type="button" aria-label="本地排行榜">排行</button>
      <button id="restart" type="button">重新开始</button>
      <button id="theme" type="button" aria-label="切换主题">◐</button>
      <button id="hint" type="button" aria-label="提示（每局 3 次）">💡 提示 <span id="hintCount">3</span></button>
      <button id="help" type="button" aria-label="重看新手引导">?</button>
      <button id="pause" type="button" aria-label="暂停（空格）" aria-pressed="false">⏸</button>
      <button id="music" type="button" aria-label="背景音乐">♪</button>
      <button id="frostDebug" type="button" aria-label="巡猎者测试（临时调试，T5 移除）">❄ 测试</button>
      <button id="mute" type="button" aria-label="静音">🔊</button>
    </div>
  </div>

  <div id="stage">
    <div id="scene">
      <div id="board">
        <div id="floor"></div>
        <div class="path-layer" id="pathLayer"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="pauseScreen" role="dialog" aria-modal="true" aria-label="游戏已暂停">
    <div class="pause-card">
      <h2>已暂停</h2>
      <p>计时已冻结 · 按空格或点击继续</p>
      <button id="resume" type="button">继续游戏</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h2 id="finalTitle">恭喜通关</h2>
      <p class="final-score" id="finalScore">0</p>
      <p id="finalTime">用时 00:00</p>
      <button id="again" type="button">再来一局</button>
    </div>
  </div>

  <div id="rankOverlay" role="dialog" aria-modal="true" aria-label="本地排行榜">
    <div class="rank-panel">
      <div class="rank-head">
        <h2>本地排行榜</h2>
        <button id="rankClose" type="button" aria-label="关闭排行榜">✕</button>
      </div>
      <div id="rankTabs" class="rank-tabs" role="group" aria-label="难度切换"></div>
      <table class="rank-table">
        <thead>
          <tr><th>名次</th><th>得分</th><th>用时</th><th>最高连击</th><th>日期</th></tr>
        </thead>
        <tbody id="rankTbody"></tbody>
      </table>
  <div id="tutorial" aria-hidden="true">
    <div class="tut-card" role="dialog" aria-modal="true" aria-labelledby="tutTitle">
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <div class="tut-dots" id="tutDots">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="tut-actions">
        <button id="tutSkip" type="button">跳过引导</button>
        <button id="tutNext" type="button">下一步</button>
      </div>
    </div>
  </div>

  <script src="js/link3d.js"></script>
  <script src="js/combo.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/music.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/hint.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/frost.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
